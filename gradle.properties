# ============================================================================
# Gradle 実行時のプロパティ
# ============================================================================

# JVM 引数。文字コードは UTF-8 に固定 (Windows のデフォルトが Shift_JIS になるため)
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# サブプロジェクトの並列ビルド・ビルドキャッシュを有効化
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin の公式コードスタイルを採用 (ktlint とも整合させる)
kotlin.code.style=official
