# ============================================================================
# dev プロファイル: 実際の AWS (dev アカウント) + 実際の dev IdP に接続する。
#
# このテンプレート自体はどの実インフラも保持していない (infra/terraform 側で将来
# プロビジョニングされる想定。本チャンクの守備範囲は :bootstrap の composition root と
# ローカル docker-compose 環境のみ)。ここに書く URI/ARN 相当の値はすべて置き換え前提の
# プレースホルダであり、実際にデプロイする際は環境ごとの正しい値に差し替えること。
# ============================================================================

spring:
  # SSM Parameter Store / Secrets Manager から設定値を読み込む (Spring Cloud AWS の
  # config-data import)。local では絶対に使わない (実 AWS アカウントへの疎通が前提のため)。
  config:
    import:
      - "aws-parameterstore:/template/dev/"
      - "aws-secretsmanager:template/dev/db-credentials"

  datasource:
    url: jdbc:postgresql://template-dev.example.internal:5432/template
    # username/password は上記 aws-secretsmanager:template/dev/db-credentials が展開する
    # プロパティ (シークレット JSON の各キーがそのままプロパティ名になる) で上書きされる想定。
    # ここに書くのはあくまでフォールバック用のプレースホルダ。
    username: template
    password: template
  r2dbc:
    url: r2dbc:postgresql://template-dev.example.internal:5432/template
    username: template
    password: template

  flyway:
    enabled: true # dev はまだ起動時マイグレーションを許容する (stg/prod は別デプロイ工程に切り出す)

  cloud:
    aws:
      region:
        static: ap-northeast-1
      # credentials は明示せず、AWS SDK のデフォルトプロバイダチェーン (ECS タスクロール等) に委ねる。

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-idp.example.com/realms/template

settlement:
  s3:
    bucket-name: template-settlements-dev
  sqs:
    queue-name: template-settlement-tasks-dev

logging:
  structured:
    format:
      console: ecs # ECS (Elastic Common Schema) 形式の JSON 構造化ログ。requestId 等の MDC が自動でフィールド化される
