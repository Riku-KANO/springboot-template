name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [dev, stg, prod]
        default: dev
        required: true

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment source
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENV" == "prod" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "prod deployment is allowed only from refs/heads/main" >&2
            exit 1
          fi
          if [[ "$DEPLOY_ENV" == "stg" && "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != refs/tags/* ]]; then
            echo "stg deployment is allowed only from main or a tag" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: sigstore/cosign-installer@v3

      - name: Build and push immutable image
        id: image
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REPOSITORY_URL}:${GITHUB_SHA::12}"
          ./gradlew :bootstrap:bootBuildImage --imageName="${IMAGE_URI}" --stacktrace
          docker push "${IMAGE_URI}"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.uri }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true

      - name: Scan image for high severity vulnerabilities
        uses: anchore/scan-action@v6
        with:
          image: ${{ steps.image.outputs.uri }}
          severity-cutoff: high
          fail-build: true

      - name: Sign verified image and attach SBOM attestation
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          cosign sign --yes "$IMAGE_URI"
          cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "$IMAGE_URI"

      - name: Register migration task definition
        id: migration-task
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          ECS_BATCH_TASK_FAMILY: ${{ vars.ECS_BATCH_TASK_FAMILY }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$ECS_BATCH_TASK_FAMILY" --query taskDefinition > task-definition.json
          jq --arg image "$IMAGE_URI" '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | .containerDefinitions |= map(if .name == "batch" then .image = $image else . end)
          ' task-definition.json > migration-task-definition.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://migration-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=${TASK_ARN}" >> "$GITHUB_OUTPUT"

      - name: Run Flyway migration
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          MIGRATION_TASK_ARN: ${{ steps.migration-task.outputs.arn }}
        run: |
          set -euo pipefail
          NETWORK=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_API_SERVICE" --query 'services[0].networkConfiguration' --output json)
          OVERRIDES=$(jq -n --arg profile "${DEPLOY_ENV},migration" '{containerOverrides:[{name:"batch",environment:[{name:"SPRING_PROFILES_ACTIVE",value:$profile}]}]}')
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$MIGRATION_TASK_ARN" \
            --network-configuration "$NETWORK" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT_CODE" = "0"

      - name: Register API task definition
        id: api-task
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
        run: |
          set -euo pipefail
          CURRENT_TASK=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_API_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$CURRENT_TASK" --query taskDefinition > task-definition.json
          jq --arg image "$IMAGE_URI" '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | .containerDefinitions |= map(if .name == "api" then .image = $image else . end)
          ' task-definition.json > api-task-definition.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://api-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=${TASK_ARN}" >> "$GITHUB_OUTPUT"

      - name: Deploy API and wait until stable
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          API_TASK_ARN: ${{ steps.api-task.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_API_SERVICE" --task-definition "$API_TASK_ARN"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_API_SERVICE"

      - name: Smoke test
        env:
          API_ENDPOINT: ${{ vars.API_ENDPOINT }}
        run: curl --fail --show-error --retry 12 --retry-all-errors --retry-delay 5 "${API_ENDPOINT}/actuator/health/readiness"
